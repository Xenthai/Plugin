<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;background:#08090c;color:#8f9aa9;font:11px ui-monospace,monospace}
.row{display:flex;align-items:flex-end;gap:14px;padding:10px 14px;border-bottom:1px solid #1c2026}
.id{width:110px;flex:none;color:#dce9ff;font-size:12px}
img{display:block;background:#000;border:1px solid #232830;height:230px}
</style><body><script>
const P=["hero","record","statement","list","question","quote","announcement","contrast"];
const T=[["vertical-story",1080,1920],["vertical-feed",1080,1350],["square",1080,1080],["horizontal",1200,630]];
for(const p of P){const r=document.createElement("div");r.className="row";r.innerHTML=`<div class="id">${p}</div>`;
for(const [t,w,h] of T){const i=new Image();i.src=`co-${p}-${t}-${w}x${h}.png`;i.width=Math.round(w*230/h);r.appendChild(i);}
document.body.appendChild(r);}
</script></body>
