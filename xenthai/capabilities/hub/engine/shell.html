<title>%%DOC_TITLE%%</title>
<meta name="claude:viewport-fit-sides" content="cover">
%%FONT_LINKS%%
<style>
/* Hub: fixed top bar, sidebar of pages, centred 880px page.
   Each sidebar entry is its own article.page, shown by #hash.
   Colours come from brand.json; never write a colour outside these tokens. */
%%TOKENS%%
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .86em; background: var(--bg-inset); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 30; height: calc(var(--header-h) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--fg-strong); min-width: 0; }
.brand img { height: 26px; width: auto; display: block; }
.brand .wordmark { font-weight: 800; font-size: 18px; letter-spacing: .02em; color: var(--fg-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.logo-dark { display: none !important; }
:root[data-theme="dark"] .logo-light { display: none !important; }
:root[data-theme="dark"] .logo-dark { display: block !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-light { display: none !important; }
  :root:not([data-theme="light"]) .logo-dark { display: block !important; }
}
.topbar .sep { width: 1px; height: 22px; background: var(--rule); flex: none; }
.hubs { display: flex; align-items: center; gap: 2px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.hubs a { color: var(--muted); text-decoration: none; padding: 6px 8px; border-radius: 6px; line-height: 1.3; }
.hubs a:hover { color: var(--fg-strong); background: var(--bg-inset); }
.hubs a[aria-current="page"] { color: var(--fg-strong); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
.hubs span { color: var(--rule); font-weight: 400; padding-inline: 2px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { position: relative; display: block; }
.search input { font: 500 13.5px var(--font); color: var(--fg); background: var(--bg-nav); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px 8px 36px; width: 240px; min-height: 38px; }
.search input::placeholder { color: var(--muted); }
.search .i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.theme { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--bg-nav); }
.theme button { font: 600 12.5px var(--font); color: var(--muted); background: transparent; border: none; padding: 0 10px; min-height: 38px; min-width: 40px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.theme button .i { width: 16px; height: 16px; }
.theme button[aria-pressed="true"] { background: var(--link); color: var(--link-fg); }
.menu-btn { display: none; align-items: center; gap: 6px; font: 600 13px var(--font); color: var(--fg); background: var(--bg-nav); border: 1px solid var(--rule); border-radius: 8px; min-height: 38px; padding: 0 12px; cursor: pointer; }

/* Sidebar */
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); }
.sidebar { position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; background: var(--bg-nav); border-right: 1px solid var(--rule); padding: 20px 14px 40px; }
.sidebar .group { margin-bottom: 18px; }
.sidebar .group-title { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-strong); padding: 0 10px 6px; }
.sidebar ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.sidebar .group a { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 7px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; line-height: 1.35; }
.sidebar .group a .i { width: 17px; height: 17px; }
.sidebar .group a:hover { color: var(--fg-strong); background: var(--bg-inset); }
.sidebar .group a.active { background: var(--link); color: var(--link-fg); font-weight: 600; }
.sidebar .hubs-m, .sidebar .search-m { display: none; }
.sidebar .search-m { margin-bottom: 16px; }
.sidebar .search-m input { width: 100%; }
.nav-foot { border-top: 1px solid var(--rule); padding: 14px 10px 0; display: flex; flex-direction: column; gap: 2px; }
.nav-foot p { margin: 0 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--fg-strong); }
.nav-foot a { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 13.5px; font-weight: 500; color: var(--link); text-decoration: none; }
.nav-foot a:hover { text-decoration: underline; }
.nav-foot a .i { width: 14px; height: 14px; }
.nav-foot a .i.ri { width: 17px; height: 17px; color: var(--muted); }

/* Page */
.content-wrap { display: flex; justify-content: center; padding-left: max(16px, clamp(16px, 4vw, 56px)); padding-right: max(16px, clamp(16px, 4vw, 56px)); padding-block: 32px 80px; min-width: 0; }
main { min-width: 0; width: 100%; max-width: 880px; }
.page { display: flex; flex-direction: column; }
.banner { position: relative; overflow: hidden; border-radius: 14px; background-color: var(--brand); background-position: center; background-size: cover; background-repeat: no-repeat; color: #ffffff; padding: 36px 36px 32px; display: flex; flex-direction: column; gap: 12px; min-height: 210px; justify-content: flex-end; isolation: isolate; }
.banner::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(var(--brand-rgb), .94) 0%, rgba(var(--brand-rgb), .78) 55%, rgba(var(--brand-rgb), .25) 100%); z-index: -1; }
.banner .crumb { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.78); }
.banner .crumb .i { width: 16px; height: 16px; color: var(--accent); }
.banner h1 { margin: 0; font-family: var(--font-display); font-size: clamp(26px, 4vw, 38px); line-height: 1.15; font-weight: 700; color: #ffffff; text-wrap: balance; max-width: 22ch; }
.banner p { margin: 0; max-width: 60ch; color: rgba(255,255,255,.86); font-size: 15.5px; }
.banner .bar { width: 56px; height: 5px; background: var(--accent); }
.banner .badge-ico { position: absolute; right: 28px; top: 28px; width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); display: grid; place-items: center; color: #ffffff; }
.banner .badge-ico .i { width: 30px; height: 30px; stroke-width: 1.6; }

section.doc { padding-top: 36px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: calc(var(--header-h) + 16px); }
section.doc h2 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.25; color: var(--fg-strong); text-wrap: balance; display: flex; align-items: center; gap: 10px; }
section.doc h2 .h-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--icon-bg); color: var(--icon-fg); display: grid; place-items: center; flex: none; }
section.doc h2 .h-ico .i { width: 18px; height: 18px; }
section.doc p { margin: 0; }
.lede { font-size: 16.5px; }
.src { font-size: 13.5px; color: var(--muted); }
ul.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ul.checks li { display: flex; gap: 10px; align-items: flex-start; }
ul.checks li .i { color: var(--ok); margin-top: 3px; width: 18px; height: 18px; }
ul.checks.bad li .i { color: var(--bad-fg); }

.aside { border-left: 4px solid var(--link); background: var(--note-bg); padding: 12px 16px; border-radius: 0 8px 8px 0; display: flex; gap: 12px; align-items: flex-start; }
.aside > .i { color: var(--link); margin-top: 2px; }
.aside.caution { border-left-color: var(--warn-bd); background: var(--warn-bg); }
.aside.caution > .i { color: var(--bad-fg); }
.aside b { color: var(--fg-strong); }
.aside div { display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.icard { border: 1px solid var(--rule); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--fg); background: var(--bg); min-width: 0; transition: border-color .15s, transform .15s; }
a.icard:hover { border-color: var(--link); transform: translateY(-2px); }
.icard .ico { width: 42px; height: 42px; border-radius: 10px; background: var(--icon-bg); color: var(--icon-fg); display: grid; place-items: center; }
.icard .ico.o { background: var(--warn-bg); color: var(--bad-fg); }
.icard b { color: var(--fg-strong); font-size: 15px; line-height: 1.35; }
.icard span { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
.icard .more { margin-top: auto; padding-top: 4px; font-size: 13px; font-weight: 600; color: var(--link); display: inline-flex; align-items: center; gap: 6px; }
.icard .more .i { width: 15px; height: 15px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.stat { padding: 18px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--rule); min-width: 0; }
.stat:last-child { border-right: none; }
.stat .i { color: var(--accent); }
.stat b { font-size: 26px; line-height: 1.1; color: var(--link); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat span { font-size: 13px; color: var(--muted); line-height: 1.45; }

.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; counter-reset: f; }
.flow li { position: relative; border: 1px solid var(--rule); border-radius: 10px; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; counter-increment: f; background: var(--bg); min-width: 0; }
.flow li::before { content: counter(f); position: absolute; top: 10px; right: 12px; font-size: 12px; font-weight: 700; color: var(--muted); }
.flow li .ico { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: #ffffff; display: grid; place-items: center; }
.flow li:last-child .ico { background: var(--accent); color: var(--accent-ink); }
.flow li b { font-size: 13.5px; line-height: 1.35; color: var(--fg-strong); }
.flow li span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.5; min-width: 520px; }
th { text-align: left; font-weight: 600; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: #ffffff; background: var(--brand); padding: 10px 14px; }
td { padding: 10px 14px; border-top: 1px solid var(--rule); vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--bg-nav); }
td.term { font-weight: 700; color: var(--fg-strong); }

figure.fig { margin: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: #ffffff; min-width: 0; }
figure.fig figcaption { background: var(--bg-nav); border-top: 1px solid var(--rule); padding: 10px 14px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
figure.fig figcaption > span { display: inline-flex; align-items: center; gap: 8px; }
figure.fig figcaption .i { width: 16px; height: 16px; }
.zoom { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: zoom-in; position: relative; }
.zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.zoom img { display: block; width: 100%; height: auto; max-width: 100%; }
.zoom .hint { position: absolute; right: 12px; top: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: rgba(var(--brand-rgb), .88); color: #ffffff; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .15s; }
.zoom:hover .hint, .zoom:focus-visible .hint { opacity: 1; }
.zoom .hint .i { width: 14px; height: 14px; }
figure.fig.tall .zoom { max-height: 900px; overflow: hidden; }
figure.fig.tall .zoom::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(rgba(255,255,255,0), #ffffff); }
.fig-actions { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.fig-actions button, .fig-actions a { font: 600 12.5px var(--font); display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 6px; text-decoration: none; cursor: pointer; }
.fig-actions .primary { background: var(--brand); color: #ffffff; border: 1px solid var(--brand); }
.fig-actions .ghost { background: var(--bg); color: var(--fg); border: 1px solid var(--rule); }
.fig-actions .ghost:hover { border-color: var(--link); color: var(--link); }
.fig-actions .i { width: 15px; height: 15px; }

ul.paths { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ul.paths li { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; background: var(--bg-nav); }
ul.paths li code { justify-self: start; background: var(--bg); }
ul.paths li span { font-size: 13.5px; color: var(--muted); }

.faqs { display: flex; flex-direction: column; gap: 8px; }
details.faq { border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); }
details.faq summary { cursor: pointer; padding: 12px 16px; font-weight: 600; color: var(--fg-strong); display: flex; align-items: center; gap: 10px; list-style: none; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary .i { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
details.faq[open] summary .i { transform: rotate(90deg); }
details.faq p { padding: 0 16px 14px 42px; font-size: 14.5px; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips span { border: 1px solid var(--rule); background: var(--bg-nav); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--fg-strong); }

.pager { margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; text-decoration: none; display: flex; flex-direction: column; gap: 2px; color: var(--fg-strong); font-weight: 600; min-width: 0; }
.pager a small { font-size: 12px; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.pager a small .i { width: 14px; height: 14px; }
.pager a.next { text-align: right; align-items: flex-end; grid-column: 2; }
.pager a:hover { border-color: var(--link); }
.foot-note { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; font-size: 12.5px; color: var(--muted); }

/* Search */
.results { position: fixed; z-index: 40; top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 6px); right: 16px; width: min(560px, calc(100vw - 32px)); max-height: min(70vh, 560px); overflow-y: auto; background: var(--bg); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 18px 48px rgba(0,0,0,.22); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.results[hidden] { display: none; }
.results .r-head { font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 10px 8px; }
.results button.r { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; }
.results button.r:hover, .results button.r.sel { background: var(--bg-inset); }
.results .r-ico { width: 32px; height: 32px; border-radius: 8px; background: var(--icon-bg); color: var(--icon-fg); display: grid; place-items: center; }
.results .r-ico .i { width: 16px; height: 16px; }
.results .r-path { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.results .r-title { font-size: 14px; font-weight: 600; color: var(--fg-strong); }
.results .r-snip { font-size: 13px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
.results mark { background: var(--icon-bg); color: var(--link); padding: 0 2px; font-weight: 700; }
.results .r-empty { padding: 18px 12px; font-size: 14px; color: var(--muted); text-align: center; }
section.doc.hit { animation: hit 1.6s ease-out; border-radius: 10px; }
@keyframes hit { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* Enlarged image viewer */
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(6, 10, 30, .92); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); }
.lightbox[hidden] { display: none; }
.lightbox-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #ffffff; font-size: 14px; padding-bottom: 10px; }
.lightbox-bar .lb-actions { display: flex; gap: 8px; }
.lightbox-bar button { font: 600 13px var(--font); min-height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #ffffff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.lightbox-bar button .i { width: 15px; height: 15px; }
.lightbox-scroll { flex: 1; overflow: auto; background: #ffffff; border-radius: 10px; -webkit-overflow-scrolling: touch; }
.lightbox-scroll img { display: block; width: 100%; max-width: none; height: auto; }
.lightbox-scroll.actual img { width: auto; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-flex; }
  .sidebar { position: fixed; z-index: 25; left: 0; right: 0; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); height: calc(100% - var(--header-h) - env(safe-area-inset-top, 0px)); border-right: none; }
  .sidebar:not(.open) { display: none; }
  .top-right > .search { display: none; }
  .sidebar .search-m { display: block; }
  .topbar .sep, .topbar .hubs { display: none; }
  .sidebar .hubs-m { display: flex; flex-wrap: wrap; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .theme .lbl { display: none; }
  .brand img { height: 20px; max-width: 120px; object-fit: contain; object-position: left; }
  .brand .wordmark { font-size: 15px; }
  .topbar { gap: 10px; }
  .theme button { min-width: 36px; padding: 0 8px; }
  .banner { padding: 26px 20px 22px; }
  .banner .badge-ico { display: none; }
  .pager { grid-template-columns: 1fr; }
  .pager a.next { grid-column: 1; }
  figure.fig.tall .zoom { max-height: 620px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
%%BANNER_BG_CSS%%
</style>

%%SPRITE%%

<header class="topbar">
  <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="sidebar"><svg class="i"><use href="#i-menu"/></svg><span>%%T_MENU%%</span></button>
  <a class="brand" href="#%%FIRST_PAGE%%">%%BRAND%%</a>
  %%HUBS_TOP%%
  <div class="top-right">
    <label class="search" for="q"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" role="combobox" aria-controls="results" aria-expanded="false" placeholder="%%T_SEARCH%%" autocomplete="off" aria-label="%%T_SEARCH%%"></label>
    <div class="theme" role="group" aria-label="%%T_THEME%%">
      <button type="button" data-set="light" aria-pressed="false" title="%%T_LIGHT%%"><svg class="i"><use href="#i-sun"/></svg><span class="lbl">%%T_LIGHT%%</span></button>
      <button type="button" data-set="system" aria-pressed="true" title="%%T_AUTO%%"><svg class="i"><use href="#i-monitor"/></svg><span class="lbl">%%T_AUTO%%</span></button>
      <button type="button" data-set="dark" aria-pressed="false" title="%%T_DARK%%"><svg class="i"><use href="#i-moon"/></svg><span class="lbl">%%T_DARK%%</span></button>
    </div>
  </div>
</header>

<div class="results" id="results" role="listbox" aria-label="%%T_RESULTS%%" hidden></div>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="%%T_PAGES%%">
    %%HUBS_MOBILE%%
    <label class="search search-m" for="q2"><svg class="i"><use href="#i-search"/></svg><input id="q2" type="search" role="combobox" aria-controls="results" aria-expanded="false" placeholder="%%T_SEARCH%%" autocomplete="off" aria-label="%%T_SEARCH%%"></label>
%%SIDEBAR_GROUPS%%
%%RESOURCES%%
  </nav>

  <div class="content-wrap">
    <main id="main">
%%PAGES%%
      <nav class="pager" id="pager" aria-label="%%T_PAGER%%"></nav>
      <div class="foot-note">%%FOOTER%%</div>
    </main>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="%%T_ZOOMED%%">
  <div class="lightbox-bar">
    <b id="lb-title"></b>
    <span class="lb-actions">
      <button type="button" id="lb-size">%%T_ACTUAL%%</button>
      <button type="button" id="lb-close"><svg class="i"><use href="#i-x"/></svg>%%T_CLOSE%%</button>
    </span>
  </div>
  <div class="lightbox-scroll" id="lb-scroll"><img id="lb-img" alt=""></div>
</div>

<script>
(function () {
  var T = %%I18N_JSON%%;
  var HUB = %%HUB_NAME_JSON%%;
  var root = document.documentElement;
  var KEY = 'hub-theme';
  function applyTheme(mode) {
    if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
    document.querySelectorAll('.theme button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.set === mode)); });
  }
  var saved = 'system';
  try { saved = localStorage.getItem(KEY) || 'system'; } catch (e) {}
  applyTheme(saved);
  document.querySelectorAll('.theme button').forEach(function (b) {
    b.addEventListener('click', function () { applyTheme(b.dataset.set); try { localStorage.setItem(KEY, b.dataset.set); } catch (e) {} });
  });

  var sb = document.getElementById('sidebar'), mb = document.getElementById('menu-btn'), mbl = mb.querySelector('span');
  function closeMenu() { sb.classList.remove('open'); mb.setAttribute('aria-expanded', 'false'); mbl.textContent = T.menu; }
  mb.addEventListener('click', function () { var o = sb.classList.toggle('open'); mb.setAttribute('aria-expanded', String(o)); mbl.textContent = o ? T.close : T.menu; });

  var links = Array.prototype.slice.call(sb.querySelectorAll('.group a[href^="#"]'));
  var ids = links.map(function (a) { return a.getAttribute('href').slice(1); });
  var pages = Array.prototype.slice.call(document.querySelectorAll('article.page'));
  var pager = document.getElementById('pager');
  function icon(n) { return '<svg class="i"><use href="#i-' + n + '"/></svg>'; }
  function show(id) {
    if (ids.indexOf(id) === -1) id = ids[0];
    pages.forEach(function (p) { p.hidden = p.id !== 'p-' + id; });
    links.forEach(function (a) { var on = a.getAttribute('href') === '#' + id; a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var page = document.getElementById('p-' + id);
    document.title = page.dataset.title + ' · ' + HUB;
    var i = ids.indexOf(id), html = '';
    if (i > 0) html += '<a href="#' + ids[i - 1] + '"><small>' + icon('arrow-left') + T.prev + '</small>' + links[i - 1].textContent + '</a>';
    if (i < ids.length - 1) html += '<a class="next" href="#' + ids[i + 1] + '"><small>' + T.next + icon('arrow-right') + '</small>' + links[i + 1].textContent + '</a>';
    pager.innerHTML = html;
    closeMenu();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1));

  var resBox = document.getElementById('results');
  var inputs = [document.getElementById('q'), document.getElementById('q2')];
  function fold(t) { var o = ''; for (var k = 0; k < t.length; k++) { var c = t[k].normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); o += c.length ? c[0] : ' '; } return o; }
  function esc(t) { return t.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var index = [];
  ids.forEach(function (pid, i) {
    var page = document.getElementById('p-' + pid), pageTitle = links[i].textContent.trim(), iconUse = links[i].querySelector('use').getAttribute('href');
    var banner = page.querySelector('.banner p');
    if (banner) { var bt = banner.textContent.replace(/\s+/g, ' ').trim(); index.push({ pid: pid, page: pageTitle, title: pageTitle, text: bt, ftext: fold(bt), ftitle: fold(pageTitle), icon: iconUse, el: null }); }
    page.querySelectorAll('section.doc').forEach(function (sec) {
      var h = sec.querySelector('h2'), title = h ? h.textContent.trim() : pageTitle;
      var text = sec.textContent.replace(/\s+/g, ' ').trim();
      index.push({ pid: pid, page: pageTitle, title: title, text: text, ftext: fold(text), ftitle: fold(title), icon: iconUse, el: sec });
    });
  });
  var current = [], sel = -1;
  function snippet(it, fq) {
    var at = it.ftext.indexOf(fq);
    if (at < 0) return esc(it.text.slice(0, 140)) + (it.text.length > 140 ? '…' : '');
    var a = Math.max(0, at - 60), b = Math.min(it.text.length, at + fq.length + 90);
    return (a > 0 ? '…' : '') + esc(it.text.slice(a, at)) + '<mark>' + esc(it.text.slice(at, at + fq.length)) + '</mark>' + esc(it.text.slice(at + fq.length, b)) + (b < it.text.length ? '…' : '');
  }
  function search(q) {
    var fq = fold(q.trim());
    inputs.forEach(function (el) { el.setAttribute('aria-expanded', String(!!fq)); });
    if (!fq) { resBox.hidden = true; current = []; return; }
    var words = fq.split(/\s+/).filter(Boolean);
    current = index.map(function (it) {
      var hay = it.ftitle + ' ' + it.ftext, score = 0;
      for (var w = 0; w < words.length; w++) { if (hay.indexOf(words[w]) === -1) return null; }
      if (it.ftitle.indexOf(fq) !== -1) score += 10;
      if (it.ftext.indexOf(fq) !== -1) score += 4;
      return { it: it, score: score };
    }).filter(Boolean).sort(function (a, b) { return b.score - a.score; }).slice(0, 12);
    sel = current.length ? 0 : -1;
    var html = current.length ? '<div class="r-head">' + current.length + ' ' + (current.length === 1 ? T.result : T.results) + '</div>' : '<div class="r-empty">' + T.noResults + ' “' + esc(q.trim()) + '”.</div>';
    current.forEach(function (r, k) {
      html += '<button type="button" class="r' + (k === sel ? ' sel' : '') + '" role="option" data-k="' + k + '"><span class="r-ico"><svg class="i"><use href="' + r.it.icon + '"/></svg></span><span><span class="r-path">' + esc(r.it.page) + '</span><br><span class="r-title">' + esc(r.it.title) + '</span><br><span class="r-snip">' + snippet(r.it, fq) + '</span></span></button>';
    });
    resBox.innerHTML = html; resBox.hidden = false;
  }
  function go(k) {
    var r = current[k]; if (!r) return;
    resBox.hidden = true; inputs.forEach(function (el) { el.value = ''; el.setAttribute('aria-expanded', 'false'); el.blur(); });
    if (location.hash.slice(1) !== r.it.pid) { location.hash = r.it.pid; show(r.it.pid); } else { closeMenu(); }
    if (r.it.el) { var el = r.it.el; setTimeout(function () { el.scrollIntoView({ block: 'start' }); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }, 30); }
  }
  function markSel() { resBox.querySelectorAll('button.r').forEach(function (b, k) { b.classList.toggle('sel', k === sel); if (k === sel) b.scrollIntoView({ block: 'nearest' }); }); }
  resBox.addEventListener('click', function (e) { var b = e.target.closest('button.r'); if (b) go(+b.dataset.k); });
  inputs.forEach(function (el) {
    el.addEventListener('input', function () { inputs.forEach(function (o) { if (o !== el) o.value = el.value; }); search(el.value); });
    el.addEventListener('focus', function () { if (el.value.trim()) search(el.value); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && current.length) { e.preventDefault(); sel = (sel + 1) % current.length; markSel(); }
      else if (e.key === 'ArrowUp' && current.length) { e.preventDefault(); sel = (sel - 1 + current.length) % current.length; markSel(); }
      else if (e.key === 'Enter' && sel >= 0) { e.preventDefault(); go(sel); }
      else if (e.key === 'Escape') { resBox.hidden = true; el.blur(); }
    });
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.results') && !e.target.closest('.search')) resBox.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName) && window.innerWidth > 860) { e.preventDefault(); inputs[0].focus(); } });

  var box = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img'), lbScroll = document.getElementById('lb-scroll'), lbTitle = document.getElementById('lb-title'), lbSize = document.getElementById('lb-size'), lastZoom = null;
  function closeBox() { box.hidden = true; document.body.style.overflow = ''; if (lastZoom) lastZoom.focus(); }
  document.querySelectorAll('[data-full]').forEach(function (b) {
    b.addEventListener('click', function () {
      var fig = b.closest('figure') || b.closest('section.doc'), img = fig ? fig.querySelector('.zoom img') : null, page = b.closest('article.page');
      lastZoom = b; lbTitle.textContent = page ? page.dataset.title : ''; lbImg.src = b.getAttribute('data-full'); lbImg.alt = img ? img.alt : '';
      lbScroll.classList.remove('actual'); lbSize.textContent = T.actual; lbScroll.scrollTop = 0; lbScroll.scrollLeft = 0;
      box.hidden = false; document.body.style.overflow = 'hidden'; document.getElementById('lb-close').focus();
    });
  });
  lbSize.addEventListener('click', function () { var on = lbScroll.classList.toggle('actual'); lbSize.textContent = on ? T.fit : T.actual; });
  document.getElementById('lb-close').addEventListener('click', closeBox);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !box.hidden) closeBox(); });
})();
</script>
