<!doctype html>
<meta charset="utf-8">
<title>render engine fixture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
<style>
  :root { --ground: #000000; --ink: #f2f5f9; --signal: #dce9ff; --faint: #616b78; }
  html, body { margin: 0; background: var(--ground); }
  [data-frame] {
    position: relative; overflow: hidden; background: var(--ground); color: var(--ink);
    display: flex; flex-direction: column; box-sizing: border-box;
  }
  [data-body] { flex: 1; display: flex; flex-direction: column; align-items: flex-start;
    justify-content: flex-start; gap: 24px; width: 100%; }
  [data-body] > * { flex: none; }
  [data-headline] {
    font-family: "Archivo", sans-serif; font-weight: 700; font-stretch: 116%;
    text-transform: uppercase; line-height: 0.98; margin: 0; color: var(--ink);
  }
  .swatch { width: 200px; height: 60px; background: var(--signal); }
  .foot { font-family: "Archivo", sans-serif; font-size: 24px; color: var(--signal); }
  .texture { color: var(--faint); opacity: 0.42; font-family: "Archivo", sans-serif; }
</style>
<body>
<script>
  const TARGETS = {
    "vertical-story": { w: 1080, h: 1920, pad: 96, h1: 78, padTop: 300, padBottom: 700 },
    "vertical-feed":  { w: 1080, h: 1350, pad: 88, h1: 76 },
    "square":         { w: 1080, h: 1080, pad: 80, h1: 64 },
    "horizontal":     { w: 1200, h: 630,  pad: 72, h1: 50 },
  };

  const params = new URLSearchParams(location.search);
  const piece = params.get("p") || "good";
  const target = params.get("f") || "square";
  const t = TARGETS[target] || TARGETS.square;

  const el = (tag, attrs, html) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "style") node.style.cssText = v;
      else node.setAttribute(k, v);
    }
    if (html !== undefined) node.innerHTML = html;
    return node;
  };

  const frame = el("div", { "data-frame": "" });
  frame.style.width = t.w + "px";
  frame.style.height = t.h + "px";
  frame.style.padding = `${t.padTop ?? t.pad}px ${t.pad}px ${t.padBottom ?? t.pad}px`;

  const body = el("div", { "data-body": "" });

  const headline = el("h1", { "data-headline": "" }, "TU EMPRESA<br>MÁS INTELIGENTE");
  headline.style.fontSize = t.h1 + "px";
  body.appendChild(headline);

  body.appendChild(el("div", { class: "swatch" }));

  if (piece === "texture-low") {
    // Deliberately dimmed texture placed low, which the soft bound allows and the hard bound
    // must not complain about.
    const low = el("p", { class: "texture", "data-texture": "" }, "textura deliberadamente atenuada");
    low.style.cssText += `position:absolute;left:${t.pad}px;top:${Math.round(t.h * 0.72)}px;font-size:28px;`;
    frame.appendChild(low);
  }

  if (piece === "bearing-low") {
    // A message-bearing element pushed into the hard keep-out. The engine must FAIL this.
    const low = el("p", { class: "foot" }, "https://xenth.ai");
    low.style.cssText += `position:absolute;left:${t.pad}px;top:${Math.round(t.h * 0.82)}px;`;
    frame.appendChild(low);
  }

  if (piece === "overflowing") {
    // Content taller than the frame, to exercise the overflow assertion.
    for (let i = 0; i < 40; i++) {
      const row = el("p", {}, "fila de relleno " + i);
      row.style.cssText = "font-family:Archivo,sans-serif;font-size:40px;margin:0";
      body.appendChild(row);
    }
  }

  frame.appendChild(body);
  frame.appendChild(el("p", { class: "foot" }, "xenth.ai"));
  document.body.appendChild(frame);
</script>
</body>
