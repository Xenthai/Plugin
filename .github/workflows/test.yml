name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Mirrors how Claude Code installs a plugin's dependencies. Anything needing a lifecycle
      # script installs cleanly with a normal `npm ci` and fails only on a client's machine, so
      # CI must use the same flag the runtime uses.
      - run: npm ci --ignore-scripts

      # Two manifests, validated separately, because `validate .` resolves to the marketplace one
      # and stops — which left plugin.json, where every hook is declared, unchecked in CI. --strict
      # fails on unrecognized fields and missing metadata that the runtime tolerates: a field the
      # runtime ignores is a field that silently does nothing on a client's machine.
      - run: npx --yes @anthropic-ai/claude-code@2.1.205 plugin validate --strict .claude-plugin/marketplace.json
      - run: npx --yes @anthropic-ai/claude-code@2.1.205 plugin validate --strict .claude-plugin/plugin.json

      # Ubuntu runners ship Microsoft Edge and Google Chrome, and the render engine resolves
      # channel msedge then chrome, so no browser download step is needed. Only deterministic
      # checks run here: cross-platform pixel comparison drifts with the runner image's font
      # stack, and a flaky red build trains everyone to ignore CI.
      - run: npm test
