name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xenthai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xenthai/package-lock.json

      # Mirrors how Claude Code installs a plugin's dependencies. Anything needing a lifecycle
      # script installs cleanly with a normal `npm ci` and fails only on a client's machine, so
      # CI must use the same flag the runtime uses.
      - run: npm ci --ignore-scripts

      # Two manifests, validated separately, because `validate .` resolves to the marketplace one
      # and stops — which left plugin.json, where every hook is declared, unchecked in CI. --strict
      # fails on unrecognized fields and missing metadata that the runtime tolerates: a field the
      # runtime ignores is a field that silently does nothing on a client's machine.
      #
      # They sit at different levels on purpose: the catalogue is the repository root and the
      # plugin is ./xenthai beneath it. That is the only shape the desktop app resolves, because
      # it syncs a marketplace over HTTP and can read files inside that repository but cannot
      # clone a second one.
      # --strict is kept, and its one expected warning is tolerated by name. Neither manifest
      # declares a `version`, deliberately: a declared version pins the plugin and an existing
      # install then never updates. The validator warns about the absence, and --strict turns every
      # warning into a failure — so the run passes only when the version warning is the ONLY thing
      # it found. Dropping --strict instead would also stop catching misspelled field names, which
      # is the failure worth catching: a field the runtime ignores does nothing on a client's
      # machine and says nothing about it.
      - name: validate both manifests (strict, tolerating the deliberate absence of version)
        run: |
          for manifest in ../.claude-plugin/marketplace.json .claude-plugin/plugin.json; do
            echo "== $manifest"
            out=$(npx --yes @anthropic-ai/claude-code@2.1.205 plugin validate --strict "$manifest" 2>&1) && status=0 || status=$?
            echo "$out"
            if [ "$status" -eq 0 ]; then continue; fi
            findings=$(printf '%s\n' "$out" | grep -E '^\s+> ' || true)
            unexpected=$(printf '%s\n' "$findings" | grep -v 'version: No version specified' || true)
            if [ -n "$unexpected" ]; then
              echo "::error::$manifest failed validation on something other than the absent version:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            echo "only the expected version warning; treating as a pass"
          done

      # Ubuntu runners ship Microsoft Edge and Google Chrome, and the render engine resolves
      # channel msedge then chrome, so no browser download step is needed. Only deterministic
      # checks run here: cross-platform pixel comparison drifts with the runner image's font
      # stack, and a flaky red build trains everyone to ignore CI.
      - run: npm test
